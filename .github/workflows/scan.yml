name: Monthly Scan

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Grype filesystem scan
        uses: anchore/scan-action@e3e9b3ef1a2405ddc4bd1dbd7335027cb8a06c6d # main
        with:
          path: "."
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        if: always()
        with:
          sarif_file: results.sarif
